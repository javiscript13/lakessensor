server {
    listen 80;
    server_name _;

    # nginx-proxy terminates TLS and forwards the original Host header here;
    # anything that isn't already www gets redirected to the www canonical host.
    if ($host !~* ^www\.) {
        return 301 https://www.$host$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
